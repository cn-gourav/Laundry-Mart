<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Laundry_Mart</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .container {
        display: grid;
        height: 100%;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        grid-template-rows: [header]10vh [main]80vh [main-bottom] 10vh [service]80vh [something] 20vh [footer] 9vh;

        grid-template-areas:
            "header header header header"
            "main main main main"
            "main-bottom main-bottom main-bottom main-bottom"
            'service service service service'
            "something something something something"
            "footer footer footer footer";

        /* gap: 10px; */
        background: #f4f4f4;
        /* padding: 10px; */
    }


    .header {
        grid-area: header;
        background: #9b59b6;
        color: white;
    }

    .main {
        grid-area: main;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 0;
        background: #feeffe;
    }

    .main-left {
        height: 100%;
        width: 100%;
        background: #3498db;
        color: white;
    }


    .main-right {
        width: 100%;
        height: 100%;
        background: #e74c3c;
        color: white;
    }

    .main-bottom {
        grid-area: main-bottom;
        background: #2ecc71;
        color: white;
    }

    .service {
        grid-area: service;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        background: #feeffe;
    }

    .l-service {
        height: 100%;
        width: 100%;
        background: #e74c3c;
        color: white;

    }

    .r-service {
        height: 100%;
        width: 100%;
        background: burlywood;
    }

    .something {
        grid-area: something;
        background: #feeffe;
    }

    .footer {
        grid-area: footer;
        background: #9b59b6;
        color: white;
    }

    .box {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.5rem;
        /* border-radius: 8px; */
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
    }


    @media (width < 600px) {
        .container {
            grid-template-areas:
                "header header "
                "main"
                "main-bottom "
                "l-service"
                "r-service"
                "something "
                "footer ";
        }

        .main {
            flex-direction: column;
        }


    }
</style>


<body>

    <div class="container">
        <div class="box header">Header</div>
        <div class="box main">
            <div class="box main-left">main left</div>
            <div class="box main-right">main-right</div>
        </div>
        <div class="box main-bottom">Main</div>

        <div class="box service">
            <div class="box l-service">Service</div>
            <div class="box r-service">service</div>
        </div>

        <div class="box something">Something</div>
        <div class="box footer">Footer</div>
    </div>
</body>

</html>
